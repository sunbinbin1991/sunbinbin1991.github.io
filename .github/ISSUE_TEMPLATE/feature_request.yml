name: 功能建议
description: 提一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题
      description: 先说问题，别直接说方案 —— 往往聊完会有更好的解法
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想要的改进
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过其他方案吗
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束
      description: 这个项目的核心原则是「零依赖、零构建、单个 HTML 文件」
      options:
        - label: 我的建议不引入第三方依赖
          required: true
        - label: 我的建议不需要构建步骤